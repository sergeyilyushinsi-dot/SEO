# Паспорт проекта для SEO-агента. Агент читает этот файл перед любой задачей.
site:
  domain: am-tech.ru
  url: https://am-tech.ru/
  brand: AM.TECH (АМ-Тех)
  cms: WordPress + WooCommerce + Elementor, SEO-плагин Yoast, кэш W3 Total Cache
  business: >
    Российский производитель и поставщик оборудования для аддитивного производства и 3D-контроля:
    SLM/EBM/MBJ 3D-принтеры по металлу, SLA и керамические 3D-принтеры, 3D-сканеры, оптические трекеры,
    геодезические лазерные сканеры, координатно-измерительные машины (КИМ). B2B, длинный цикл сделки,
    цена «по запросу», конверсия — заявка/звонок/КП.
  audience: >
    Главные технологи, инженеры-конструкторы, отделы ОТК и метрологии, руководители производств
    (машиностроение, авиастроение, ОПК, энергетика, медицина, вузы и НИИ), отделы закупок и импортозамещения.

regions:
  # ID регионов Яндекса: 225 — Россия, 213 — Москва, 2 — Санкт-Петербург, 54 — Екатеринбург
  wordstat: [225]
  serp: 213

# Целевые зоны позиций, по которым агент строит отчёты и план.
targets:
  - ТОП-3   # приоритетные коммерческие кластеры с высоким спросом
  - ТОП-10  # основная масса коммерческих и информационных кластеров
  - ТОП-20  # новые направления и длинный хвост — промежуточная цель
  - ТОП-30  # вход в зону видимости для новых страниц

