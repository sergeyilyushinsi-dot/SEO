# Яндекс может считать их аффилированными и показывать по запросу только один — следим за этим в serp.
# role — текущая специализация по данным Метрики; целевое разделение ролей согласовать с клиентом.
group_sites:
  - domain: i3d.ru
    metrika_counter: "57472282"
    role: мультибрендовый магазин группы (SLS, FGF, КИМ, сканеры, SLM, порошки, расходники); есть бренд-страница AM.TECH
  - domain: industry3d.ru
    metrika_counter: "85971711"
    role: отраслевое медиа о 3D-печати — информационные запросы, самый большой поисковый трафик группы
  - domain: amsolid.ru
    metrika_counter: "99035254"
    role: песчаная 3D-печать Binder Jetting (FHZL PCM), литейное производство
  - domain: scantech-3d.ru
    metrika_counter: "95647848"
    role: нет визитов в Метрике за 15.09–12.10.2026 — уточнить, работает ли сайт
  - domain: fhzl.ru
    metrika_counter: "96416581"
    role: нет визитов в Метрике за 15.09–12.10.2026 — уточнить, работает ли сайт

