# Конкуренты для сверки позиций, структуры и тем.
# domain — без https:// и www (по нему сопоставляются краулинг и выдача); url — если сайт открывается только с www.
# directions — ключи из config/project.yaml → directions.
# Профили уточнены по краулингу 13.10.2026 — подробности в reports/competitors-2026-10-13.md.
competitors:
  - domain: lsystems.ru
    url: https://www.lsystems.ru/
    name: Лазерные системы (Санкт-Петербург)
    directions: [slm]
    notes: >
      Прямой конкурент по SLM: М-450-L, М-450-М, М-150 + SLS по металлу М-450-S. В марте 2026 М-450-М внесена в реестр
      ГИСП; в прессе — «единственный» производитель SLM, признанный российским. Контрактная печать, реверс-инжиниринг,
      реинжиниринг, консалтинг (/3d-printing/). Лидары, алкорамки — нецелевые разделы.

  - domain: onsint.ru
    name: Онсинт
    directions: [slm]
    notes: >
      Российский разработчик SLM и SLS оборудования, продаёт металлические и полимерные порошки. Сайт на Tilda, 33 страницы.
      SLS у AM.TECH нет.

  - domain: 3dlam.com
    name: 3DLAM (ЗАО «Биоград», Санкт-Петербург)
    directions: [slm]
    notes: >
      Производитель SLM (Mini, Mid, Maxi, Mule), ЦАТ с печатью на заказ. Сильная структура: 10 отраслевых страниц,
      6 страниц материалов, 29 кейсов с конкретными деталями, статья «Что такое SLM-печать».

  - domain: amfastform.ru
    url: https://www.amfastform.ru/
    name: FastForm (Россия)
    directions: [slm]
    notes: >
      Машинный перевод китайского сайта FastForm (FF-M140C…FF-M800, DeskFab), URL на китайском. Слабый SEO-конкурент.

  - domain: 3dvision.su
    name: 3DVision — магазин 3D-техники и центр аддитивных технологий
    directions: [slm, sla, scanners, services]
    notes: >
      Магазин 3D-техники (~9000 URL) + услуги: печать металлом SLM (от 220 ₽/см³), SLA, сканирование, литьё, пусконаладка
      (вкл. КИМ). Категории сканеров по задачам. Разметка Service/Offer/FAQPage на услугах.

  - domain: lider-3d.ru
    name: Лидер-3D (Москва)
    directions: [scanners, sla, services]
    notes: >
      Поставщик и интегратор цифрового, аддитивного и субтрактивного оборудования; услуги 3D-печати, сканирования,
      моделирования. Много потребительского ассортимента — при сравнении отделять промышленные разделы.

  - domain: vilitek.ru
    name: Вилитек
    directions: [slm]
    notes: >
      ТОП-3 по «купить slm принтер» (со слов клиента, 13.10.2026) — страница /products/slm-3d-printery/ (ZRapid, 5 моделей).
      Дистрибьютор лабораторного и промышленного оборудования (~3000 URL): атомайзеры, оборудование для работы с порошком.
