# Конкуренты для сверки позиций, структуры и тем.
# domain — без https:// и www (по нему сопоставляются краулинг и выдача); url — если сайт открывается только с www.
# directions — ключи из config/project.yaml → directions.
# Профили ниже — предварительные, по открытым источникам на 13.10.2026; уточнить после краулинга сайтов.
competitors:
  - domain: lsystems.ru
    url: https://www.lsystems.ru/
    name: Лазерные системы (Санкт-Петербург)
    directions: [slm]
    notes: >
      Прямой конкурент по SLM: установки M-450-L / M-450-M (500×500 мм). В марте 2026 M-450-M внесена в реестр ГИСП;
      в прессе подаётся как «единственный» производитель SLM-принтеров, признанных российскими. Кроме 3D-печати —
      лидары, алкорамки, спектрометры (нецелевые разделы для сравнения).

  - domain: onsint.ru
    name: Онсинт
    directions: [slm]
    notes: >
      Российский разработчик SLM (металл) и SLS (пластик) принтеров, проект крупногабаритного SLM с TEN group.
      SLS у AM.TECH нет — возможная тема для сравнения технологий, а не прямой конкурент по ассортименту.

  - domain: 3dlam.com
    name: 3DLAM (ЗАО «Биоград», Санкт-Петербург)
    directions: [slm]
    notes: Российский производитель SLM-принтеров с 2019 г. (напр. 3DLAM Maxi, зона построения до Ø317×400 мм).

  - domain: amfastform.ru
    url: https://www.amfastform.ru/
    name: FastForm (Россия)
    directions: [slm]
    notes: >
      Предположительно российский сайт китайского производителя SLM FastForm (линейка M140C, M180D, M220, M300) —
      в открытых источниках не подтверждено, проверить при краулинге.

  - domain: 3dvision.su
    name: 3DVision — магазин 3D-техники и центр аддитивных технологий
    directions: [slm, sla, scanners, solutions]
    notes: >
      Широкий ассортимент: 3D-принтеры (от персональных до промышленных, вкл. металл), 3D-сканеры, материалы;
      услуги 3D-моделирования, сканирования, печати, литья в силикон. Конкурент по каталогу и по услугам.

  - domain: lider-3d.ru
    name: Лидер-3D (Москва)
    directions: [scanners, sla, solutions]
    notes: >
      Поставщик и интегратор цифрового, аддитивного и субтрактивного оборудования; услуги 3D-печати, сканирования,
      моделирования. Много потребительского ассортимента — при сравнении отделять промышленные разделы.

  - domain: vilitek.ru
    name: Вилитек
    directions: []
    notes: Профиль в открытых источниках не найден — определить направления по краулингу.
